name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_XANO_API_URL: ${{ vars.PUBLIC_XANO_API_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUBLIC_XANO_API_URL PUBLIC_SITE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions setting: ${name}"
              exit 1
            fi
          done

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          PUBLIC_XANO_API_URL: ${{ vars.PUBLIC_XANO_API_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_DEAL_FINDER_ENABLED: "true"
          PUBLIC_DEAL_FINDER_USE_MOCK_DATA: "false"
          PUBLIC_SEO_TAXONOMY_API_ENABLED: ${{ vars.PUBLIC_SEO_TAXONOMY_API_ENABLED }}
          PUBLIC_SEO_TAXONOMY_COMPATIBILITY_FALLBACK_ENABLED: ${{ vars.PUBLIC_SEO_TAXONOMY_COMPATIBILITY_FALLBACK_ENABLED }}
          PUBLIC_SEO_CATALOG_API_ENABLED: ${{ vars.PUBLIC_SEO_CATALOG_API_ENABLED }}
          PUBLIC_SEO_CATALOG_COMPATIBILITY_FALLBACK_ENABLED: ${{ vars.PUBLIC_SEO_CATALOG_COMPATIBILITY_FALLBACK_ENABLED }}
          PUBLIC_SEO_SITEMAP_SHARDS_ENABLED: ${{ vars.PUBLIC_SEO_SITEMAP_SHARDS_ENABLED }}
          PUBLIC_SEO_SITEMAP_COMPATIBILITY_FALLBACK_ENABLED: ${{ vars.PUBLIC_SEO_SITEMAP_COMPATIBILITY_FALLBACK_ENABLED }}
          I18N_ENABLED: "true"
          I18N_API_READ_ENABLED: "true"
          I18N_ADMIN_TEST_LOCALE_AWARE_READ_ENABLED: "false"
          I18N_DUAL_WRITE_ENABLED: "false"
          I18N_PUBLIC_ROUTES_ENABLED: "true"
          I18N_AI_TRANSLATION_ENABLED: "false"
          PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist/client
          command: pages deploy . --project-name sitecraft-auto-market --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if npm run test:http:production -- --require-edge-cache --deployment-cache-bust "${GITHUB_SHA}"; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
