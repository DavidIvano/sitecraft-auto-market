name: Production SEO health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-seo-health
  cancel-in-progress: false

jobs:
  audit:
    name: Audit 28 locales and Search Console
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production SEO health audit
        id: seo_health
        continue-on-error: true
        env:
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          SEO_HEALTH_REQUIRE_SEARCH_CONSOLE: ${{ vars.SEO_HEALTH_REQUIRE_SEARCH_CONSOLE }}
        run: npm run seo:health -- --output artifacts/seo-health/latest.json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-seo-health-${{ github.run_id }}
          path: artifacts/seo-health/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Open or update alert issue
        if: steps.seo_health.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[SEO Health] Production audit requires attention";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const body = [
              "The scheduled production SEO audit failed.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Download the `production-seo-health` artifact for the exact locale, sitemap, schema, or Search Console violations.",
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Fail workflow when audit failed
        if: steps.seo_health.outcome == 'failure'
        run: exit 1
