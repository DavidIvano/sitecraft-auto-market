name = "sitecraft-auto-market"
pages_build_output_dir = "dist/client"
compatibility_date = "2026-06-27"

[env.production]
compatibility_date = "2026-06-30"

[env.production.vars]
# Server-side upload configuration. Preview origins must be added explicitly.
XANO_API_URL = "https://x8ki-letl-twmt.n7.xano.io/api:jAAj839u"
R2_PUBLIC_BASE_URL = "https://sitecraft-auto-market.pages.dev/api/r2-images"
ALLOWED_UPLOAD_ORIGINS = "https://sitecraft-auto-market.pages.dev,https://automarket.sitecraft.agency"
ENVIRONMENT = "production"

[[env.production.r2_buckets]]
# Runtime binding consumed by Pages Functions. R2_BUCKET_NAME is not used by the app.
binding = "R2_BUCKET"
bucket_name = "car-images"

# Cloudflare Pages rejects the Workers-only `images` configuration key.
# Pages Functions therefore use the optional runtime fallback implemented by
# the image endpoints when the IMAGES binding is unavailable.

[env.preview]
compatibility_date = "2026-06-30"

[env.preview.vars]
# Isolated configuration for the disposable authenticated upload verification.
XANO_API_URL = "https://x8ki-letl-twmt.n7.xano.io/api:jAAj839u"
R2_PUBLIC_BASE_URL = "https://upload-auth-fix.sitecraft-auto-market.pages.dev/api/r2-images"
ALLOWED_UPLOAD_ORIGINS = "https://upload-auth-fix.sitecraft-auto-market.pages.dev"
ENVIRONMENT = "preview"

[[env.preview.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "car-images"
